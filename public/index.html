<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e6e1d7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1d20" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Notizzettel – einfach losschreiben.">
  <title>Notizzettel</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Verlauf">
      <header class="sidebar-head">
        <a class="brand" href="/" data-link>
          <span class="brand-mark" data-icon="logo"></span>
          <span class="brand-name">Notizzettel</span>
        </a>
      </header>
      <nav class="history" id="history" aria-label="Deine Zettel"></nav>
      <footer class="sidebar-foot">
        <a class="foot-btn" href="/papierkorb" data-link id="trash-link">
          <span data-icon="trash"></span>
          <span>Papierkorb</span>
          <span class="count" id="trash-count" hidden></span>
        </a>
        <a class="foot-btn" href="/admin" data-link id="admin-link" hidden>
          <span data-icon="shield"></span>
          <span>Verwaltung</span>
        </a>
        <a class="foot-btn" href="/login" data-link id="account-link">
          <span data-icon="user"></span>
          <span id="account-label">Anmelden</span>
        </a>
      </footer>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn only-drawer" id="btn-menu" type="button" aria-label="Verlauf öffnen" aria-controls="sidebar" aria-expanded="false">
          <span data-icon="menu"></span>
        </button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="status sync-badge" id="sync-badge" role="status" hidden></div>
        <div class="spacer"></div>
        <div class="fmt" id="fmt" role="toolbar" aria-label="Formatierung">
          <div class="segmented glass">
            <button class="fmt-btn" type="button" data-cmd="bold" aria-label="Fett (Strg+B)" title="Fett (Strg+B)" aria-pressed="false"><b>B</b></button>
            <button class="fmt-btn" type="button" data-cmd="italic" aria-label="Kursiv (Strg+I)" title="Kursiv (Strg+I)" aria-pressed="false"><i>I</i></button>
            <button class="fmt-btn" type="button" data-cmd="underline" aria-label="Unterstrichen (Strg+U)" title="Unterstrichen (Strg+U)" aria-pressed="false"><u>U</u></button>
          </div>
          <button class="fmt-btn fmt-done glass" type="button" id="btn-done" aria-label="Tastatur schließen" title="Fertig"><span data-icon="chevronDown"></span></button>
        </div>
        <span class="divider editor-only" aria-hidden="true"></span>
        <button class="icon-btn" id="btn-new" type="button" aria-label="Neuer Zettel" title="Neuer Zettel">
          <span data-icon="plus"></span>
        </button>
        <button class="icon-btn editor-only" id="btn-delete" type="button" aria-label="Zettel löschen" title="In den Papierkorb" disabled>
          <span data-icon="trash"></span>
        </button>
      </header>

      <section class="view view-editor" id="view-editor" aria-label="Zettel">
        <div class="pad">
          <div class="sheet">
            <div class="glue" aria-hidden="true"></div>
            <div class="sheet-head">
              <time class="stamp" id="stamp"></time>
            </div>
            <div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true"
                 aria-label="Notiz" spellcheck="true" autocapitalize="sentences"
                 data-placeholder="Schreib einfach los …"></div>
          </div>
        </div>
      </section>

      <section class="view view-page" id="view-trash" hidden></section>
      <section class="view view-page" id="view-login" hidden></section>
      <section class="view view-page" id="view-setup" hidden></section>
      <section class="view view-page" id="view-account" hidden></section>
      <section class="view view-page" id="view-admin" hidden></section>
      <section class="view view-page" id="view-invite" hidden></section>
      <section class="view view-page" id="view-reset" hidden></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-text" id="toast-text"></span>
      <button type="button" class="toast-action" id="toast-action" hidden></button>
    </div>

    <dialog class="dialog card" id="dialog"></dialog>
  </div>
</body>
</html>
